# ═══════════════════════════════════════════════════════════
# OUROBOROS V2 — MODEL POOL CONFIGURATION
# 6 debate models (rotating pool) + 2 judges (macro_judge + meta_judge).
# ═══════════════════════════════════════════════════════════

[defaults]
api_base = "https://openrouter.ai/api/v1/chat/completions"
referer = "https://github.com/Triarchy-Labs/mantle-turing-ai-swarm"
app_title = "Ouroboros-V2"
max_failures_before_rotate = 2

# ─── DEBATE POOL (rotates on failure) ───

[[debate_pool]]
id = "google/gemma-4-31b-it:free"
title = "Gemma-4-31B"
vendor = "Google"
timeout_ms = 15000
max_tokens = 150
priority = 1

[[debate_pool]]
id = "nex-agi/nex-n2-pro:free"
title = "Nex-N2-Pro"
vendor = "NexAGI"
timeout_ms = 30000
max_tokens = 150
priority = 2

[[debate_pool]]
id = "qwen/qwen3-next-80b-a3b-instruct:free"
title = "Qwen3-80B"
vendor = "Alibaba"
timeout_ms = 30000
max_tokens = 150
priority = 3

[[debate_pool]]
id = "poolside/laguna-m.1:free"
title = "Laguna-M.1"
vendor = "Poolside"
timeout_ms = 30000
max_tokens = 150
priority = 4

[[debate_pool]]
id = "meta-llama/llama-3.3-70b-instruct:free"
title = "Llama-3.3-70B"
vendor = "Meta"
timeout_ms = 30000
max_tokens = 150
priority = 5

[[debate_pool]]
id = "openai/gpt-oss-20b:free"
title = "GPT-OSS-20B"
vendor = "OpenAI"
timeout_ms = 30000
max_tokens = 150
priority = 6

# ─── INDEPENDENT JUDGES (never in debate pool) ───

[macro_judge_model]
id = "openai/gpt-oss-120b:free"
title = "GPT-OSS-120B"
vendor = "OpenAI"
timeout_ms = 30000
max_tokens = 120

[meta_judge_model]
id = "nvidia/nemotron-3-ultra-550b-a55b:free"
title = "Nemotron-Ultra-550B"
vendor = "NVIDIA"
timeout_ms = 45000
max_tokens = 100
